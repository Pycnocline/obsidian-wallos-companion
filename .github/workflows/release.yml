name: Release Obsidian plugin
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'esbuild.config.mjs'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Set release tag
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - name: Publish BRAT-compatible release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refusing to replace published artifacts"
            exit 0
          fi
          gh release create "$TAG" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "Wallos Companion $TAG" \
            --notes "Obsidian Wallos Companion beta release for BRAT. Requires Obsidian 1.11.4+. Open the plugin settings to connect to Wallos." \
            --latest
